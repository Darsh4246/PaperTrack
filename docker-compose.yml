services:
  papertrack:
    build: .
    container_name: papertrack
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${PORT}:${PORT}"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=${PORT}
      - DB_HOST=localhost
      - DB_PORT=5432
      - DB_USER=${DB_USER:?set DB_USER}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
      - DB_NAME=${DB_NAME:?set DB_NAME}
      - OLLAMA_URL=http://localhost:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:?set OLLAMA_MODEL}
      - AI_CACHE_MINUTES=${AI_CACHE_MINUTES:?set AI_CACHE_MINUTES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ollama_data:/root/.ollama
      - ./init.sql:/docker-initdb/init.sql:ro

volumes:
  postgres_data:
  ollama_data: