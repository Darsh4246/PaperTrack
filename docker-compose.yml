services:
  papertrack:
    build: .
    container_name: papertrack
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${PORT}:${PORT}"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=${PORT:?set PORT}

      - DB_HOST=localhost
      - DB_PORT=5432
      - DB_USER=${DB_USER:?set DB_USER}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
      - DB_NAME=${DB_NAME:?set DB_NAME}

      - GEMINI_API_KEY=${GEMINI_API_KEY:?set GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - AI_CACHE_MINUTES=${AI_CACHE_MINUTES:?set AI_CACHE_MINUTES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-initdb/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -q"]
      interval: 10s
      retries: 10
      start_period: 30s

volumes:
  postgres_data: