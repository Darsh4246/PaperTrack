services:
  # ── PaperTrack Web Application ─────────────────────────────────
  app:
    build: .
    container_name: papertrack-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000

      # Database Configuration
      # (Defaults to host.docker.internal to connect to Postgres installed on host)
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-Darsh@123}
      - DB_NAME=${DB_NAME:-DPS_Student_Details}

      # Ollama AI Configuration (connects to Ollama on host machine)
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gpt-oss:20b-cloud}
      - AI_CACHE_MINUTES=${AI_CACHE_MINUTES:-30}

    # Enables communication with services running on host (Postgres & Ollama)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Optional: Standalone PostgreSQL Database in Docker ──────────
  # Run with: docker compose --profile with-db up
  db:
    image: postgres:16-alpine
    container_name: papertrack-db
    restart: unless-stopped
    profiles:
      - with-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: DPS_Student_Details
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Darsh@123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:

