[supervisord]
nodaemon=true
user=root

[program:postgres]
command=/usr/lib/postgresql/current/bin/postgres -D /var/lib/postgresql/data -c listen_addresses=localhost
user=postgres
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ollama]
command=ollama serve
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:app]
command=bash -c "until pg_isready -h localhost -q; do sleep 1; done; exec node server.js"
directory=/app
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0